<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="원문 기반 반도체·배터리 산업 뉴스 브리핑과 아카이브">
  <title>Process Brief</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#"><span>PB</span> Process Brief</a>
    <div id="updated">업데이트 확인 중</div>
  </header>

  <main>
    <section class="intro">
      <p class="eyebrow">VERIFIED DAILY BRIEF</p>
      <h1>반도체·배터리 뉴스 브리핑</h1>
      <p>오늘 발행 기사를 우선하며, 부족한 경우에만 최대 3일 이내 기사로 구성합니다. 과거 검증 기사는 아카이브에서 확인할 수 있습니다.</p>
    </section>

    <nav class="sector-tabs" aria-label="뉴스 보기">
      <button class="sector-tab active" data-view="semiconductor">
        <span class="dot semi"></span>반도체 <b id="semiCount">0</b>
      </button>
      <button class="sector-tab" data-view="battery">
        <span class="dot battery"></span>배터리 <b id="batteryCount">0</b>
      </button>
      <button class="sector-tab" data-view="archive">
        <span class="dot archive"></span>아카이브 <b id="archiveCount">0</b>
      </button>
    </nav>

    <div id="viewNote" class="view-note">오늘 기사 우선 · 부족하면 최대 3일 이내 기사로 구성</div>

    <section class="controls">
      <label class="search">
        <span>⌕</span>
        <input id="searchInput" type="search" placeholder="제목·기업·기술·키워드 검색">
      </label>
      <select id="regionFilter" aria-label="지역">
        <option value="all">국내 + 해외</option>
        <option value="domestic">국내</option>
        <option value="global">해외</option>
      </select>
      <select id="categoryFilter" aria-label="분류">
        <option value="all">전체 분류</option>
        <option value="기술·공정">기술·공정</option>
        <option value="투자·양산">투자·양산</option>
        <option value="정책">정책</option>
        <option value="산업">산업</option>
        <option value="시장·실적">시장·실적</option>
        <option value="산업동향">산업동향</option>
      </select>
      <div id="archiveControls" class="archive-controls" hidden>
        <select id="archiveSector" aria-label="아카이브 분야">
          <option value="all">반도체 + 배터리</option>
          <option value="semiconductor">반도체</option>
          <option value="battery">배터리</option>
        </select>
        <input id="archiveDate" type="date" aria-label="아카이브 발행일">
      </div>
    </section>

    <section class="database">
      <div class="table-head">
        <span>발행일</span><span>지역</span><span>분류</span><span>뉴스 제목</span><span>키워드</span><span>출처</span>
      </div>
      <div id="newsRows"></div>
      <div id="empty" class="empty" hidden></div>
    </section>

    <section class="verification-note">
      <strong>요약 기준</strong>
      <span>URL 원문 접근 성공 기사만 수록</span>
      <span>원문 사실만 한국어로 정리</span>
      <span>중복 보도 제거</span>
      <span>반도체·배터리 별도 선정</span>
    </section>
  </main>

  <template id="rowTemplate">
    <article class="news-row">
      <button class="row-summary" type="button" aria-expanded="false">
        <span class="published"></span>
        <span class="region badge"></span>
        <span class="category badge"></span>
        <span class="headline"></span>
        <span class="keywords"></span>
        <span class="source"></span>
      </button>
      <div class="row-detail" hidden>
        <div class="detail-main">
          <section><h3>기사 요약</h3><p class="overview"></p></section>
          <section><h3>핵심 사실</h3><ul class="key-points"></ul></section>
          <section class="numbers-wrap"><h3>주요 수치·일정</h3><ul class="numbers"></ul></section>
          <section class="outlook-wrap"><h3>원문에 명시된 계획·영향</h3><p class="outlook"></p></section>
        </div>
        <aside>
          <dl>
            <div><dt>수집일</dt><dd class="collected"></dd></div>
            <div><dt>발행일</dt><dd class="published-full"></dd></div>
            <div><dt>출처</dt><dd class="source-full"></dd></div>
          </dl>
          <a class="original-link" target="_blank" rel="noopener noreferrer">기사 원문 보기 ↗</a>
          <p>AI 요약은 원문을 대체하지 않습니다.</p>
        </aside>
      </div>
    </article>
  </template>

  <footer>Original-source summaries only · 자동 업데이트</footer>
  <script src="app.js"></script>
</body>
</html>
