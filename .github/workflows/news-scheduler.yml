name: Automatic 24h news cycle

on:
  schedule:
    # Check once per hour at :23. The Python code rolls the bundle only when
    # 24 hours have elapsed since automatic_cycle_started_at.
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: daily-news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check whether an automatic run is needed
        id: guard
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          KST = timezone(timedelta(hours=9))
          now = datetime.now(KST)
          try:
              data = json.loads(Path("data/news.json").read_text(encoding="utf-8"))
              started = (
                  data.get("automatic_cycle_started_at")
                  or data.get("last_automatic_update_at")
                  or data.get("updated_at", "")
              )
              current = data.get("current_items", [])
              locked = data.get("automatic_locked_vacancies", {})
          except Exception:
              started, current, locked = "", [], {}

          try:
              cycle_start = datetime.strptime(str(started)[:16], "%Y-%m-%d %H:%M").replace(tzinfo=KST)
          except (TypeError, ValueError):
              cycle_start = None

          due = cycle_start is None or now - cycle_start >= timedelta(hours=24)
          semi_count = sum(x.get("sector") == "semiconductor" for x in current)
          battery_count = sum(x.get("sector") == "battery" for x in current)
          semi_target = max(0, 5 - int(locked.get("semiconductor", 0)))
          battery_target = max(0, 5 - int(locked.get("battery", 0)))
          complete = semi_count >= semi_target and battery_count >= battery_target

          # While the cycle is younger than 24h, retry only if the automatic
          # bundle has vacancies. Once due, always run the rollover.
          skip = (not due) and complete
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"skip={'true' if skip else 'false'}\n")
          print(
              f"automatic_cycle_started_at={started}, due={due}, "
              f"current={semi_count}/{semi_target} + {battery_count}/{battery_target}, skip={skip}"
          )
          PY

      - name: Collect and summarize news
        if: steps.guard.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
        run: python scripts/update_news_final.py

      - name: Save updated data
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "news-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet || git commit -m "chore: automatic 24h news cycle"
          git push
