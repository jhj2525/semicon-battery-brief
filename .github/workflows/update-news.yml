name: Daily news update

on:
  schedule:
    # 매일 09:00 KST(=00:00 UTC) 1회만 실행.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      article_url:
        description: "수동 추가할 기사 URL · 여러 개는 줄바꿈 (자동 업데이트만 할 때는 비우기)"
        required: false
        type: string
      article_sector:
        description: "수동 기사를 넣을 분야"
        required: false
        default: semiconductor
        type: choice
        options:
          - semiconductor
          - battery
          - semi_market
              pasted_article_id:
        description: "본문을 직접 입력할 기사 ID"
        required: false
        type: string
      pasted_article_text:
        description: "사용자가 직접 입력한 기사 본문"
        required: false
        type: string  
      delete_article_id:
        description: "아카이브에서 삭제할 기사 ID · 일반 실행에서는 비우기"
        required: false
        type: string
      edit_article_id:
        description: "제목을 수정할 수동 기사 ID · 일반 실행에서는 비우기"
        required: false
        type: string
      edit_article_title:
        description: "수정할 기사 제목"
        required: false
        type: string
      favorite_article_id:
        description: "즐겨찾기 변경 기사 ID · 일반 실행에서는 비우기"
        required: false
        type: string
      favorite_state:
        description: "즐겨찾기 추가 true / 해제 false"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Skip backup if today already ran
        id: guard
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          today = datetime.now(timezone(timedelta(hours=9))).strftime("%Y-%m-%d")
          try:
              data = json.loads(Path("data/news.json").read_text(encoding="utf-8"))
              updated = data.get("last_automatic_update_at") or data.get("updated_at", "")
              current = data.get("current_items", [])
          except Exception:
              updated = ""
              current = []
          semi_count = sum(x.get("sector") == "semiconductor" for x in current)
          battery_count = sum(x.get("sector") == "battery" for x in current)
          scheduled = os.getenv("GITHUB_EVENT_NAME") == "schedule"
          complete = semi_count >= 5 and battery_count >= 5
          skip = scheduled and updated.startswith(today) and complete
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"skip={'true' if skip else 'false'}\n")
          print(
              f"today={today}, updated_at={updated}, "
              f"current={semi_count}/5 + {battery_count}/5, skip={skip}"
          )
          PY
      - name: Collect and summarize news
        if: steps.guard.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          MANUAL_ARTICLE_URL: ${{ inputs.article_url }}
          MANUAL_ARTICLE_SECTOR: ${{ inputs.article_sector }}
          PASTED_ARTICLE_ID: ${{ inputs.pasted_article_id }}
          PASTED_ARTICLE_TEXT: ${{ inputs.pasted_article_text }}
          DELETE_ARTICLE_ID: ${{ inputs.delete_article_id }}
          EDIT_ARTICLE_ID: ${{ inputs.edit_article_id }}
          EDIT_ARTICLE_TITLE: ${{ inputs.edit_article_title }}
          FAVORITE_ARTICLE_ID: ${{ inputs.favorite_article_id }}
          FAVORITE_STATE: ${{ inputs.favorite_state }}
        run: python scripts/update_news_final.py
      - name: Save updated data
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "news-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet || git commit -m "chore: update daily news"
          git push
